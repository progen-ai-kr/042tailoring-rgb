<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Orca에서 Codex 창을 닫고 다시 여는 네 단계</title>
  <desc id="desc">현재 Codex 탭의 닫기 버튼을 누르고, 플러스 버튼을 누른 뒤 메뉴에서 Codex를 선택하여 새 OpenAI Codex 터미널을 여는 방법</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#070b12" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#6f8cff"/>
    </marker>
    <style>
      text { font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      .mono { font-family: "SFMono-Regular", "Menlo", "Consolas", monospace; }
      .title { font-size: 56px; font-weight: 700; fill: #f6f8fc; }
      .subtitle { font-size: 25px; font-weight: 500; fill: #aeb8cb; }
      .panel-title { font-size: 29px; font-weight: 700; fill: #f7f8fb; }
      .callout { font-size: 25px; font-weight: 700; fill: #ffffff; }
      .ui { font-size: 20px; font-weight: 500; fill: #ebedf2; }
      .ui-small { font-size: 17px; font-weight: 500; fill: #aeb4c0; }
      .terminal { font-size: 18px; font-weight: 500; fill: #d7dae0; }
      .note { font-size: 25px; font-weight: 700; fill: #17213a; }
      .note-small { font-size: 21px; font-weight: 500; fill: #485774; }
    </style>
  </defs>

  <rect width="1800" height="1120" rx="42" fill="#111722"/>
  <circle cx="1680" cy="90" r="170" fill="#506dff" opacity="0.10"/>
  <circle cx="1590" cy="155" r="82" fill="#49c58a" opacity="0.09"/>
  <text x="70" y="92" class="title">Orca에서 Codex 창 다시 열기</text>
  <text x="72" y="137" class="subtitle">현재 작업을 최신 코드와 합친 뒤, 아래 화면 순서대로 한 번만 진행하세요.</text>

  <!-- 1: close current Codex tab -->
  <g transform="translate(70 200)">
    <rect width="500" height="560" rx="30" fill="#1b222e" filter="url(#shadow)"/>
    <text x="34" y="55" class="panel-title">1. 현재 Codex 창 닫기</text>
    <rect x="34" y="92" width="432" height="112" rx="12" fill="#181a1e" stroke="#454b54" stroke-width="2"/>
    <rect x="48" y="105" width="365" height="84" fill="#202328"/>
    <path d="M68 139a10 10 0 1 1 12 11" fill="none" stroke="#f2b600" stroke-width="5" stroke-linecap="round"/>
    <circle cx="87" cy="139" r="4" fill="#f2b600"/>
    <text x="107" y="145" class="ui">왜 아직도 여기서 작업한 내용...</text>
    <text x="382" y="145" class="ui" fill="#b8bdc7">×</text>
    <rect x="347" y="111" width="66" height="66" rx="14" fill="none" stroke="#ff6b6b" stroke-width="5"/>
    <circle cx="380" cy="144" r="45" fill="#ff6b6b" opacity="0.10"/>
    <path d="M380 211V282" stroke="#ff8b8b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="49" y="300" width="402" height="100" rx="20" fill="#2c3545"/>
    <circle cx="91" cy="350" r="25" fill="#ff6b6b"/>
    <text x="91" y="359" text-anchor="middle" class="callout">1</text>
    <text x="130" y="358" class="callout">탭 오른쪽 × 클릭</text>
    <text x="49" y="452" class="ui-small">Orca 앱 전체가 아니라</text>
    <text x="49" y="482" class="ui-small">현재 Codex 탭만 닫습니다.</text>
  </g>

  <!-- 2 and 3: plus menu -->
  <g transform="translate(620 200)">
    <rect width="500" height="560" rx="30" fill="#1b222e" filter="url(#shadow)"/>
    <text x="34" y="55" class="panel-title">2. + 누르고 Codex 선택</text>
    <rect x="34" y="90" width="432" height="64" rx="10" fill="#181a1e"/>
    <text x="59" y="132" class="ui" fill="#f1f3f7">+</text>
    <circle cx="64" cy="123" r="28" fill="#6f8cff" opacity="0.18"/>
    <rect x="43" y="101" width="42" height="42" rx="10" fill="none" stroke="#6f8cff" stroke-width="4"/>

    <rect x="54" y="172" width="392" height="325" rx="17" fill="#080a0d" stroke="#3c434f" stroke-width="2"/>
    <text x="76" y="207" class="ui-small">열린 탭, 파일, URL, agent 검색...</text>
    <line x1="54" y1="225" x2="446" y2="225" stroke="#2a2e35"/>
    <text x="77" y="260" class="ui">▣  새로운 Terminal</text>
    <text x="77" y="301" class="ui">◎  새 브라우저 탭</text>
    <text x="77" y="342" class="ui">▤  새로운 Markdown</text>
    <text x="77" y="383" class="ui">▯  새로운 모바일 에뮬레이터</text>
    <line x1="54" y1="403" x2="446" y2="403" stroke="#2a2e35"/>
    <rect x="66" y="416" width="368" height="54" rx="10" fill="#34363c" stroke="#676b74"/>
    <circle cx="89" cy="443" r="12" fill="#7a7d85"/>
    <path d="M83 438l12 10M95 438l-12 10" stroke="#c5c8ce" stroke-width="2"/>
    <text x="113" y="451" class="ui">Codex</text>
    <rect x="262" y="473" width="181" height="34" rx="5" fill="#30343a" stroke="#777d87"/>
    <text x="274" y="496" class="ui-small">새 terminal에서 Codex 실행</text>

    <circle cx="105" cy="102" r="20" fill="#6f8cff"/>
    <text x="105" y="111" text-anchor="middle" class="callout">2</text>
    <circle cx="408" cy="443" r="20" fill="#49c58a"/>
    <text x="408" y="452" text-anchor="middle" class="callout">3</text>
  </g>

  <!-- 4: new Codex terminal -->
  <g transform="translate(1170 200)">
    <rect width="560" height="560" rx="30" fill="#1b222e" filter="url(#shadow)"/>
    <text x="34" y="55" class="panel-title">3. 새 Codex 창 확인</text>
    <rect x="34" y="90" width="492" height="370" rx="12" fill="#272c34" stroke="#737984" stroke-width="2"/>
    <text x="54" y="128" class="terminal mono">&gt;_</text>
    <text x="94" y="128" class="terminal mono" font-weight="700">OpenAI Codex</text>
    <text x="270" y="128" class="terminal mono" fill="#9ba2ae">(v0.150.1)</text>
    <text x="54" y="182" class="terminal mono" fill="#9ba2ae">model:</text>
    <text x="172" y="182" class="terminal mono">gpt-5.6-sol xhigh</text>
    <text x="54" y="217" class="terminal mono" fill="#9ba2ae">directory:</text>
    <text x="172" y="217" class="terminal mono">/Volumes/.../웹사이트 교육</text>
    <text x="54" y="252" class="terminal mono" fill="#9ba2ae">permissions:</text>
    <text x="192" y="252" class="terminal mono" fill="#d999ff">YOLO mode</text>
    <line x1="34" y1="287" x2="526" y2="287" stroke="#444a54"/>
    <text x="54" y="330" class="terminal mono" font-weight="700">Tip:</text>
    <text x="105" y="330" class="terminal mono">새 Codex 터미널이 열렸습니다.</text>
    <rect x="49" y="361" width="462" height="62" rx="7" fill="#3a404b"/>
    <text x="61" y="399" class="terminal mono">› 내 이름을 홍길동으로 등록해줘</text>
    <circle cx="489" cy="393" r="22" fill="#49c58a"/>
    <text x="489" y="402" text-anchor="middle" class="callout">4</text>
    <text x="45" y="503" class="ui-small">OpenAI Codex 제목과 입력창이</text>
    <text x="45" y="533" class="ui-small">보이면 새 창 열기 완료입니다.</text>
  </g>

  <path d="M580 480H608" stroke="#6f8cff" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1130 480H1158" stroke="#6f8cff" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="70" y="825" width="1660" height="210" rx="32" fill="#f3f6fd"/>
  <circle cx="145" cy="930" r="48" fill="#f39c3d"/>
  <text x="145" y="945" text-anchor="middle" class="callout" font-size="42">!</text>
  <text x="225" y="902" class="note">닫는 것: 현재 Codex 탭(창) 하나</text>
  <text x="225" y="946" class="note">닫지 않는 것: Orca 앱 · 프로젝트 폴더 · clone · 작업트리</text>
  <text x="225" y="990" class="note-small">순서: 탭의 × → + 버튼 → Codex → OpenAI Codex 화면 확인</text>
</svg>
