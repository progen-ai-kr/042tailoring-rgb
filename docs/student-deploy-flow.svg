<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">학생용 Orca와 Codex 작업·배포 흐름</title>
  <desc id="desc">처음 한 번 최신 코드 받기, Codex 재시작, 이름 등록을 하고 평소에는 수정 요청, 미리보기, 배포해 세 단계만 수행하는 안내</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#14213d" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14213d"/>
      <stop offset="1" stop-color="#254a79"/>
    </linearGradient>
    <style>
      text { font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      .title { font-size: 58px; font-weight: 700; fill: #ffffff; }
      .subtitle { font-size: 27px; font-weight: 500; fill: #dce9ff; }
      .section { font-size: 34px; font-weight: 700; fill: #14213d; }
      .step { font-size: 22px; font-weight: 700; fill: #4f6bff; letter-spacing: 1px; }
      .card-title { font-size: 29px; font-weight: 700; fill: #14213d; }
      .body { font-size: 22px; font-weight: 500; fill: #40516d; }
      .daily-number { font-size: 37px; font-weight: 700; fill: #ffffff; }
      .daily-title { font-size: 30px; font-weight: 700; fill: #14213d; }
      .flow-title { font-size: 21px; font-weight: 700; fill: #14213d; }
      .flow-small { font-size: 17px; font-weight: 500; fill: #66758c; }
      .warning { font-size: 24px; font-weight: 700; fill: #8a3e17; }
    </style>
  </defs>

  <rect width="1200" height="1600" rx="44" fill="#f5f7fb"/>
  <path d="M0 44Q0 0 44 0H1156Q1200 0 1200 44V255H0Z" fill="url(#header)"/>
  <circle cx="1082" cy="70" r="118" fill="#ffffff" opacity="0.05"/>
  <circle cx="1130" cy="198" r="72" fill="#72d7a8" opacity="0.18"/>
  <text x="70" y="103" class="subtitle">PROGEN 학생용</text>
  <text x="70" y="168" class="title">Orca + Codex 작업·배포</text>
  <text x="70" y="216" class="subtitle">처음 한 번만 준비하고, 평소에는 세 단계만 기억하세요.</text>

  <text x="60" y="330" class="section">처음 한 번만</text>
  <rect x="60" y="365" width="330" height="250" rx="26" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="435" y="365" width="330" height="250" rx="26" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="810" y="365" width="330" height="250" rx="26" fill="#ffffff" filter="url(#shadow)"/>

  <rect x="86" y="391" width="92" height="38" rx="19" fill="#e9edff"/>
  <text x="111" y="418" class="step">STEP 1</text>
  <text x="86" y="474" class="card-title">최신 코드 받기</text>
  <text x="86" y="520" class="body">현재 작업을 보존하고</text>
  <text x="86" y="554" class="body">최신 origin/main과</text>
  <text x="86" y="588" class="body">안전하게 합치기</text>

  <rect x="461" y="391" width="92" height="38" rx="19" fill="#e9edff"/>
  <text x="486" y="418" class="step">STEP 2</text>
  <text x="461" y="474" class="card-title">Codex 다시 시작</text>
  <text x="461" y="520" class="body">현재 Codex 섹션만 종료</text>
  <text x="461" y="554" class="body">같은 프로젝트에서</text>
  <text x="461" y="588" class="body">새 섹션 시작</text>

  <rect x="836" y="391" width="92" height="38" rx="19" fill="#e9edff"/>
  <text x="861" y="418" class="step">STEP 3</text>
  <text x="836" y="474" class="card-title">내 이름 등록</text>
  <text x="836" y="520" class="body">“이 컴퓨터의 학생 이름을</text>
  <text x="836" y="554" class="body">홍길동으로 등록해줘”</text>
  <text x="836" y="588" class="body">한 번만 말하기</text>

  <path d="M397 490H426" stroke="#9caae0" stroke-width="5" stroke-linecap="round"/>
  <path d="M418 478L430 490L418 502" fill="none" stroke="#9caae0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M772 490H801" stroke="#9caae0" stroke-width="5" stroke-linecap="round"/>
  <path d="M793 478L805 490L793 502" fill="none" stroke="#9caae0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="60" y="710" class="section">평소에는 이 세 단계만</text>
  <rect x="60" y="750" width="1080" height="330" rx="34" fill="#ffffff" filter="url(#shadow)"/>

  <circle cx="235" cy="865" r="63" fill="#4f6bff"/>
  <text x="224" y="878" class="daily-number">1</text>
  <text x="155" y="972" class="daily-title">수정 요청</text>
  <text x="140" y="1010" class="body">원하는 것을 말하기</text>

  <circle cx="600" cy="865" r="63" fill="#2bb673"/>
  <text x="589" y="878" class="daily-number">2</text>
  <text x="520" y="972" class="daily-title">미리보기</text>
  <text x="480" y="1010" class="body">PC·모바일 확인하기</text>

  <circle cx="965" cy="865" r="63" fill="#f39c3d"/>
  <text x="954" y="878" class="daily-number">3</text>
  <text x="889" y="972" class="daily-title">“배포해”</text>
  <text x="862" y="1010" class="body">완성됐을 때 한마디</text>

  <path d="M320 865H507" stroke="#d0d7e6" stroke-width="7" stroke-linecap="round"/>
  <path d="M488 848L510 865L488 882" fill="none" stroke="#d0d7e6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M685 865H872" stroke="#d0d7e6" stroke-width="7" stroke-linecap="round"/>
  <path d="M853 848L875 865L853 882" fill="none" stroke="#d0d7e6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="60" y="1168" class="section">“배포해” 이후에는 자동</text>
  <g transform="translate(60 1205)">
    <rect width="190" height="138" rx="22" fill="#e9edff"/>
    <text x="95" y="56" text-anchor="middle" class="flow-title">학생 브랜치</text>
    <text x="95" y="88" text-anchor="middle" class="flow-small">작업 안전 보존</text>
    <text x="95" y="114" text-anchor="middle" class="flow-small">학생별 구분</text>
  </g>
  <g transform="translate(280 1205)">
    <rect width="190" height="138" rx="22" fill="#e8f7ef"/>
    <text x="95" y="56" text-anchor="middle" class="flow-title">최신 main 병합</text>
    <text x="95" y="88" text-anchor="middle" class="flow-small">다른 학생 작업</text>
    <text x="95" y="114" text-anchor="middle" class="flow-small">함께 유지</text>
  </g>
  <g transform="translate(500 1205)">
    <rect width="190" height="138" rx="22" fill="#fff4df"/>
    <text x="95" y="56" text-anchor="middle" class="flow-title">자동 검사</text>
    <text x="95" y="88" text-anchor="middle" class="flow-small">코드·링크·이미지</text>
    <text x="95" y="114" text-anchor="middle" class="flow-small">모바일 확인</text>
  </g>
  <g transform="translate(720 1205)">
    <rect width="190" height="138" rx="22" fill="#f0eafa"/>
    <text x="95" y="56" text-anchor="middle" class="flow-title">PR·대기열</text>
    <text x="95" y="88" text-anchor="middle" class="flow-small">한 명씩 순서대로</text>
    <text x="95" y="114" text-anchor="middle" class="flow-small">최종 재검사</text>
  </g>
  <g transform="translate(940 1205)">
    <rect width="200" height="138" rx="22" fill="#e7f4ff"/>
    <text x="100" y="56" text-anchor="middle" class="flow-title">main·사이트</text>
    <text x="100" y="88" text-anchor="middle" class="flow-small">자동 병합</text>
    <text x="100" y="114" text-anchor="middle" class="flow-small">자동 배포</text>
  </g>

  <path d="M252 1274H272" stroke="#a5afc0" stroke-width="4" stroke-linecap="round"/>
  <path d="M472 1274H492" stroke="#a5afc0" stroke-width="4" stroke-linecap="round"/>
  <path d="M692 1274H712" stroke="#a5afc0" stroke-width="4" stroke-linecap="round"/>
  <path d="M912 1274H932" stroke="#a5afc0" stroke-width="4" stroke-linecap="round"/>

  <rect x="60" y="1408" width="1080" height="122" rx="28" fill="#fff1e8"/>
  <circle cx="113" cy="1469" r="29" fill="#f39c3d"/>
  <text x="113" y="1479" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#ffffff">!</text>
  <text x="162" y="1461" class="warning">직접 pull·push·reset하지 마세요.</text>
  <text x="162" y="1497" class="body">오류가 보이면 그대로 Codex에게 보여주면 작업을 보존해 해결합니다.</text>
</svg>
