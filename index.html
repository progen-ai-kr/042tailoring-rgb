<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 아래 제목을 브랜드 이름으로 바꾸세요 -->
  <title>브랜드 이름</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== 상단 메뉴 (모바일에서는 ☰ 버튼) ===== -->
  <header class="nav">
    <div class="nav-inner">
      <a href="#home" class="logo">BRAND</a>
      <button class="nav-toggle" aria-label="메뉴 열기">☰</button>
      <nav class="nav-menu">
        <a href="#about">소개</a>
        <a href="#lookbook">룩북</a>
        <a href="#contact">문의</a>
      </nav>
    </div>
  </header>

  <!-- ===== 첫 화면(히어로) ===== -->
  <section id="home" class="hero">
    <h1>브랜드 한 줄 슬로건</h1>
    <p>여기에 브랜드를 소개하는 짧은 문장을 적으세요.</p>
    <a href="#lookbook" class="btn">둘러보기</a>
  </section>

  <!-- ===== 소개 ===== -->
  <section id="about" class="section">
    <h2>브랜드 소개</h2>
    <p>브랜드 이야기, 철학, 만드는 사람에 대한 내용을 적으세요.</p>
  </section>

  <!-- ===== 룩북/제품 ===== -->
  <section id="lookbook" class="section">
    <h2>룩북</h2>
    <div class="grid">
      <!-- 카드 하나가 제품/사진 하나입니다. 필요한 만큼 복사하세요. -->
      <div class="card"><div class="card-img"></div><p>제품 이름</p></div>
      <div class="card"><div class="card-img"></div><p>제품 이름</p></div>
      <div class="card"><div class="card-img"></div><p>제품 이름</p></div>
    </div>
  </section>

  <!-- ===== 문의 ===== -->
  <section id="contact" class="section">
    <h2>문의</h2>
    <p>인스타그램 · 이메일 등 연락처를 적으세요.</p>
  </section>

  <footer class="footer">
    <p>© 브랜드 이름</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
