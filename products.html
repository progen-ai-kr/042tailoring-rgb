<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>제품 — 브랜드 이름</title>
  <meta name="description" content="브랜드의 제품(컬렉션)을 소개합니다." />
  <link rel="icon" href="images/favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo">BRAND</a>
      <button class="nav-toggle" aria-label="메뉴 열기">☰</button>
      <nav class="nav-menu">
        <a href="index.html">홈</a>
        <a href="about.html">브랜드 소개</a>
        <a href="products.html" class="active">제품</a>
        <a href="portfolio.html">포트폴리오</a>
        <a href="contact.html">문의</a>
      </nav>
    </div>
  </header>

  <!-- [작성서 05: 취급 품목] -->
  <section class="page-head">
    <h1>제품</h1>
    <p>취급 품목을 여기에 적으세요. (예: Dress / Jacket / Shirt / Skirt)</p>
  </section>

  <!-- ===== 제품 목록 =====
       ★ 제품은 여기 HTML이 아니라 products.json 파일에서 관리합니다.
       products.json에 제품을 추가하면 이 목록과 상세 페이지에 자동으로 나타납니다. -->
  <section class="section">
    <div class="grid" id="product-list">
      <!-- products.json 내용이 자동으로 채워집니다 -->
    </div>
  </section>

  <footer class="footer">
    <p class="logo">BRAND</p>
    <p class="biz">
      상호: ○○○ · 대표자: ○○○<br />
      사업자등록번호: 000-00-00000 · 주소: ○○○
    </p>
    <p>© 브랜드 이름. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
  <script>
    // products.json을 읽어 제품 카드를 자동으로 그립니다. (수정할 필요 없음)
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    fetch("products.json")
      .then((r) => r.json())
      .then((data) => {
        const box = document.getElementById("product-list");
        box.innerHTML = data.products
          .map((p) => {
            const img = p.images && p.images[0]
              ? '<img src="' + esc(p.images[0]) + '" alt="' + esc(p.name) + '" onerror="this.remove()" />'
              : "";
            return (
              '<a class="card" href="product.html?id=' + encodeURIComponent(p.id) + '">' +
              '<div class="card-img">' + img + "</div>" +
              '<p class="k">' + esc(p.label || "") + "</p>" +
              "<h3>" + esc(p.name) + "</h3>" +
              "<p>" + esc(p.summary || "") + "</p>" +
              "</a>"
            );
          })
          .join("");
      })
      .catch(() => {
        document.getElementById("product-list").innerHTML =
          "<p>제품을 불러오지 못했습니다. 로컬에서는 npx serve 로 미리보기 하세요.</p>";
      });
  </script>
</body>
</html>
